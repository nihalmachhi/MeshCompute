name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --frozen --extra dev --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest -q --cov=meshcompute --cov-fail-under=80
      - run: docker compose config -q && docker compose build
      - working-directory: site
        run: npm ci && npm run lint && npm run typecheck && npm test -- --run && npm run build