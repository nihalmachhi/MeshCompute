name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MESH_COMPUTE_DATABASE_URL: postgresql+psycopg://meshcompute:meshcompute@localhost:5432/meshcompute
      MESH_COMPUTE_ADMIN_TOKEN: ci-admin-token-for-tests-only
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: meshcompute
          POSTGRES_USER: meshcompute
          POSTGRES_PASSWORD: meshcompute
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meshcompute -d meshcompute"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --frozen --all-extras
      - run: uv run alembic upgrade head && uv run alembic check
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest -q --cov=meshcompute --cov-fail-under=80
      - name: Regenerate synthetic evaluation data
        run: make reproduce && git diff --exit-code -- site/src/features/simulator/__fixtures__/cluster.json site/src/data/results.generated.json
      - name: Prepare Compose environment
        run: cp .env.example .env
      - name: Validate Compose and build image
        run: docker compose config -q && docker compose build
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: site
        run: npm ci && npm run lint && npm run typecheck && npm test -- --run && npm run build
