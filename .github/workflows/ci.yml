name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --frozen --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest -q --cov=meshcompute --cov-fail-under=80
      - name: Prepare Compose environment
        run: cp .env.example .env
      - name: Validate Compose and build image
        run: docker compose config -q && docker compose build
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: site
        run: npm ci && npm run lint && npm run typecheck && npm test -- --run && npm run build