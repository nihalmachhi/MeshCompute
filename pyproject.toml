[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meshcompute"
version = "0.2.0"
description = "A durable, horizontally scalable distributed task processing platform."
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy[asyncio]>=2.0.35,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<7",
  "testcontainers[postgres]>=4.8,<5",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "pre-commit>=3.8,<5",
  "matplotlib>=3.9,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: requires PostgreSQL (and optionally Docker)",
  "failure: exercises worker and lease failure recovery",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E402"]

[tool.coverage.run]
omit = [
  "src/meshcompute/handlers/vision/*",
  "src/meshcompute/worker/agent.py",
  "src/meshcompute/worker/main.py",
  "src/meshcompute/worker/__main__.py",
  "src/meshcompute/worker/coordinator_client.py",
  "src/meshcompute/worker/executor.py",
  "src/meshcompute/worker/heartbeat.py",
  "src/meshcompute/coordinator/services/*",
  "src/meshcompute/coordinator/repositories/*",
  "src/meshcompute/coordinator/db/*",
  "src/meshcompute/coordinator/background/*",
  "src/meshcompute/coordinator/api/*",
  "src/meshcompute/coordinator/main.py",
]

[tool.coverage.report]
fail_under = 80

[tool.mypy]
python_version = "3.12"
strict = false
check_untyped_defs = true
mypy_path = "src"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "meshcompute.handlers.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "meshcompute.sim.*"
ignore_errors = true
